[project]
name = "goit-pythonweb-hw-10"
version = "0.1.0"
description = "REST API contacts auth homework"
authors = [
    {name = "Max"}
]
readme = "README.md"
requires-python = "^3.13"
dependencies = [
    "fastapi (==0.115.13)",
    "uvicorn[standard] (==0.30.6)",
    "sqlalchemy (==2.0.41)",
    "asyncpg (==0.30.0)",
    "alembic (==1.16.1)",
    "pydantic (==2.11.4)",
    "pydantic-settings (==2.9.1)",
    "email-validator (==2.2.0)",
    "faker (==37.1.0)",
    "passlib[bcrypt] (==1.7.4)",
    "bcrypt (==4.0.1)",
    "python-jose[cryptography] (==3.3.0)",
    "python-multipart (==0.0.9)",
    "fastapi-mail (==1.4.1)",
    "cloudinary (==1.41.0)",
    "libgravatar (==1.0.4)",
    "slowapi (==0.1.9)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
