[project]
name = "goit-pythonweb-hw-08"
version = "0.1.0"
description = "REST API contacts homework"
authors = [
    {name = "Max"}
]
readme = "README.md"
requires-python = "^3.13"
dependencies = [
    "fastapi (==0.115.13)",
    "uvicorn[standard] (==0.30.6)",
    "sqlalchemy (==2.0.41)",
    "asyncpg (==0.30.0)",
    "alembic (==1.16.1)",
    "pydantic (==2.11.4)",
    "pydantic-settings (==2.9.1)",
    "email-validator (==2.2.0)",
    "faker (==37.1.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
